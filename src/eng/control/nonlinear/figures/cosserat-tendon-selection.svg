<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- left: cross-section with three tendons -->
<circle cx="190" cy="180" r="130" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4">
<line x1="190" y1="180" x2="90" y2="180"/>
<line x1="190" y1="180" x2="240" y2="93.4"/>
<line x1="190" y1="180" x2="240" y2="266.6"/>
</g>
<g fill="#ffffff" stroke="#1f2937" stroke-width="2">
<circle cx="90" cy="180" r="8"/>
<circle cx="240" cy="93.4" r="8"/>
<circle cx="240" cy="266.6" r="8"/>
</g>
<circle cx="190" cy="180" r="4" fill="#1f2937"/>
<text x="62" y="172">1</text>
<text x="252" y="86">3</text>
<text x="252" y="286">2</text>
<text x="128" y="172" font-size="13">r<tspan font-size="10" dy="4">s</tspan></text>
<text x="196" y="210" font-size="13">120°</text>
<!-- beta arc from tendon 1 direction (180 deg) clockwise in screen toward tendon 2 -->
<path d="M 130 180 A 60 60 0 0 0 160 232" fill="none" stroke="#2563eb" stroke-width="2"/>
<polygon points="160,232 147,229 156,220" fill="#2563eb"/>
<text x="108" y="222" fill="#2563eb">β</text>
<!-- desired direction -->
<line x1="190" y1="180" x2="150" y2="249" stroke="#2563eb" stroke-width="3"/>
<polygon points="143,261 143,244 156,251" fill="#2563eb"/>
<text x="20" y="335" fill="#2563eb" font-size="14">desired bending direction û</text>
<text x="40" y="30" font-size="16">Cross-section: tendons at radius r<tspan font-size="11" dy="4">s</tspan><tspan dy="-4">, 120° apart</tspan></text>
<!-- right: weights in sectors -->
<g font-size="14">
<text x="400" y="80" font-size="16">Sector rule (linear interpolation)</text>
<text x="400" y="120">0 &lt; β ≤ 2π/3:  tendons 1 and 2 active</text>
<text x="400" y="160">2π/3 &lt; β ≤ 4π/3:  tendons 2 and 3 active</text>
<text x="400" y="200">4π/3 &lt; β ≤ 2π:  tendons 3 and 1 active</text>
<text x="400" y="250">weight of the trailing tendon falls from 1 to 0,</text>
<text x="400" y="272">weight of the leading tendon rises from 0 to 1</text>
<text x="400" y="294">across each 120° sector; the third tendon is slack.</text>
</g>
</svg>
