<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="14" fill="#1f2937">
<!-- spinal cord -->
<rect x="260" y="60" width="380" height="290" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="450" y="88" text-anchor="middle" font-weight="bold">Spinal cord (L2–L4)</text>

<!-- muscles -->
<ellipse cx="210" cy="490" rx="90" ry="28" fill="#fef3c7" stroke="#6b7280"/>
<line x1="40" y1="490" x2="120" y2="490" stroke="#6b7280" stroke-width="4"/>
<rect x="66" y="482" width="26" height="16" rx="4" fill="#dcfce7" stroke="#1f2937"/>
<text x="79" y="524" text-anchor="middle" font-size="13">GTO</text>
<ellipse cx="190" cy="490" rx="20" ry="7" fill="#dbeafe" stroke="#2563eb"/>
<text x="216" y="495" font-size="13">spindle</text>
<text x="210" y="545" text-anchor="middle" font-weight="bold">Quadriceps (extensor)</text>

<ellipse cx="720" cy="490" rx="90" ry="28" fill="#fef3c7" stroke="#6b7280"/>
<text x="720" y="545" text-anchor="middle" font-weight="bold">Hamstrings (flexor)</text>

<!-- Ia afferent -->
<path d="M190,483 L190,130 L272,130" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<line x1="272" y1="130" x2="337" y2="264" stroke="#2563eb" stroke-width="2.5"/><polygon points="337.0,264.0 324.2,253.6 336.8,247.4" fill="#2563eb"/>
<line x1="272" y1="130" x2="466" y2="174" stroke="#2563eb" stroke-width="2.5"/><polygon points="466.0,174.0 449.8,177.5 452.9,163.9" fill="#2563eb"/>
<text x="180" y="200" text-anchor="end">Ia afferent</text>
<text x="180" y="218" text-anchor="end" font-size="13">(from spindle)</text>
<text x="315" y="205" fill="#2563eb" font-weight="bold">+</text>
<text x="400" y="148" fill="#2563eb" font-weight="bold">+</text>

<!-- Ia inhibitory interneuron -->
<circle cx="480" cy="180" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="502" y="176" font-size="13">Ia inhibitory</text>
<text x="502" y="192" font-size="13">interneuron</text>
<line x1="490" y1="192" x2="557" y2="265" stroke="#dc2626" stroke-width="2.5"/><polygon points="548.7,269.2 561.9,257.1 565.3,260.8 552.1,272.9" fill="#dc2626"/>
<text x="538" y="228" fill="#dc2626" font-weight="bold">−</text>

<!-- motor neurons -->
<circle cx="350" cy="280" r="18" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="350" y="285" text-anchor="middle" font-weight="bold">Q</text>
<circle cx="570" cy="280" r="18" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="570" y="285" text-anchor="middle" font-weight="bold">H</text>
<line x1="345" y1="298" x2="262" y2="462" stroke="#2563eb" stroke-width="2.5"/><polygon points="262.0,462.0 262.5,445.5 275.0,451.8" fill="#2563eb"/>
<line x1="578" y1="297" x2="676" y2="463" stroke="#2563eb" stroke-width="2.5"/><polygon points="676.0,463.0 662.3,453.6 674.4,446.5" fill="#2563eb"/>
<text x="300" y="440" fill="#2563eb" font-weight="bold">+ contracts</text>
<text x="668" y="405" fill="#dc2626" font-weight="bold">relaxes</text>

<!-- Renshaw cell -->
<circle cx="440" cy="300" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="440" y="336" text-anchor="middle" font-size="13">Renshaw cell</text>
<line x1="328" y1="332" x2="426" y2="306" stroke="#2563eb" stroke-width="2"/><polygon points="426.0,306.0 414.8,314.6 412.0,303.9" fill="#2563eb"/>
<line x1="428" y1="294" x2="371" y2="284" stroke="#dc2626" stroke-width="2"/><polygon points="375.0,275.6 371.9,293.3 367.0,292.4 370.1,274.7" fill="#dc2626"/>
<line x1="446" y1="288" x2="474" y2="199" stroke="#dc2626" stroke-width="2"/><polygon points="481.8,204.1 464.7,198.7 466.2,193.9 483.3,199.3" fill="#dc2626"/>

<!-- Ib pathway -->
<path d="M79,482 L79,320 L272,320" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/><polygon points="272.0,320.0 259.0,325.5 259.0,314.5" fill="#2563eb"/>
<circle cx="288" cy="318" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="262" y="296" text-anchor="middle" font-size="13">Ib interneuron</text>
<line x1="298" y1="309" x2="333" y2="290" stroke="#dc2626" stroke-width="2"/><polygon points="335.1,299.1 326.5,283.3 330.9,280.9 339.5,296.7" fill="#dc2626"/>
<text x="92" y="342" font-size="13">Ib afferent (GTO)</text>
</g>
<!-- legend -->
<g font-size="14" fill="#1f2937">
<line x1="40" y1="595" x2="90" y2="595" stroke="#2563eb" stroke-width="2.5"/><polygon points="90.0,595.0 75.0,602.0 75.0,588.0" fill="#2563eb"/>
<text x="100" y="600">excitatory (+)</text>
<line x1="230" y1="595" x2="280" y2="595" stroke="#dc2626" stroke-width="2.5"/><polygon points="277.5,604.0 277.5,586.0 282.5,586.0 282.5,604.0" fill="#dc2626"/>
<text x="290" y="600">inhibitory (−, glycine)</text>
<circle cx="480" cy="595" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="496" y="600">inhibitory interneuron</text>
<text x="676" y="600">Q, H: α motor neurons</text>
</g>
</svg>
