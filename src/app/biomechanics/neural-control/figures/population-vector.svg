<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="14" fill="#1f2937">
<text x="235" y="40" text-anchor="middle" font-weight="bold">One neuron: cosine tuning</text>
<text x="650" y="40" text-anchor="middle" font-weight="bold">Many neurons: population vector</text>

<!-- tuning plot -->
<line x1="70" y1="360" x2="410" y2="360" stroke="#1f2937" stroke-width="1.5"/>
<line x1="70" y1="360" x2="70" y2="70" stroke="#1f2937" stroke-width="1.5"/>
<g font-size="13" text-anchor="middle">
<text x="70" y="380">0</text><text x="152.5" y="380">90</text><text x="235" y="380">180</text><text x="317.5" y="380">270</text><text x="400" y="380">360</text>
<text x="235" y="404">movement direction (degrees)</text>
</g>
<g font-size="13" text-anchor="end">
<text x="62" y="364">0</text><text x="62" y="224">30</text><text x="62" y="84">60</text>
</g>
<g stroke="#1f2937"><line x1="66" y1="220" x2="70" y2="220"/><line x1="66" y1="80" x2="70" y2="80"/>
<line x1="152.5" y1="360" x2="152.5" y2="364"/><line x1="235" y1="360" x2="235" y2="364"/><line x1="317.5" y1="360" x2="317.5" y2="364"/><line x1="400" y1="360" x2="400" y2="364"/></g>
<text x="24" y="215" font-size="13" text-anchor="middle" transform="rotate(-90 24 215)">firing rate (spikes/s)</text>
<line x1="70" y1="220" x2="400" y2="220" stroke="#d1d5db" stroke-dasharray="4 4"/>
<text x="404" y="214" font-size="12" fill="#6b7280">baseline</text>
<line x1="152.5" y1="360" x2="152.5" y2="96" stroke="#dc2626" stroke-dasharray="5 4"/>
<text x="160" y="92" font-size="13" fill="#dc2626">preferred direction</text>
<polyline points="70,220 90.6,175.3 111.3,137.4 131.9,112.2 152.5,103.3 173.1,112.2 193.8,137.4 214.4,175.3 235,220 255.6,264.7 276.3,302.6 296.9,327.8 317.5,336.7 338.1,327.8 358.8,302.6 379.4,264.7 400,220" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<g fill="#1f2937">
<circle cx="70" cy="226" r="4"/><circle cx="111.3" cy="131" r="4"/><circle cx="152.5" cy="108" r="4"/><circle cx="193.8" cy="145" r="4"/><circle cx="235" cy="214" r="4"/><circle cx="276.3" cy="296" r="4"/><circle cx="317.5" cy="331" r="4"/><circle cx="358.8" cy="309" r="4"/><circle cx="400" cy="226" r="4"/>
</g>

<!-- population vector -->
<circle cx="650" cy="240" r="110" fill="none" stroke="#e5e7eb" stroke-dasharray="4 4"/>
<g stroke="#6b7280" stroke-width="2">
<line x1="650" y1="240" x2="735.9" y2="240"/><polygon points="735.9,240.0 722.9,245.5 722.9,234.5" fill="#6b7280"/>
<line x1="650" y1="240" x2="734.4" y2="191.3"/><polygon points="734.4,191.3 725.9,202.6 720.4,193.0" fill="#6b7280"/>
<line x1="650" y1="240" x2="698.7" y2="155.6"/><polygon points="698.7,155.6 697.0,169.6 687.4,164.1" fill="#6b7280"/>
<line x1="650" y1="240" x2="650" y2="154.1"/><polygon points="650.0,154.1 655.5,167.1 644.5,167.1" fill="#6b7280"/>
<line x1="650" y1="240" x2="617.1" y2="183.1"/><polygon points="617.1,183.1 628.4,191.6 618.8,197.1" fill="#6b7280"/>
<line x1="650" y1="240" x2="613.4" y2="218.8"/><polygon points="613.4,218.8 627.4,220.6 621.9,230.1" fill="#6b7280"/>
<line x1="650" y1="240" x2="627.8" y2="240"/>
<line x1="650" y1="240" x2="640.9" y2="245.3"/>
<line x1="650" y1="240" x2="644.7" y2="249.1"/>
<line x1="650" y1="240" x2="650" y2="262.2"/>
<line x1="650" y1="240" x2="671.2" y2="276.6"/><polygon points="671.2,276.6 659.9,268.1 669.4,262.6" fill="#6b7280"/>
<line x1="650" y1="240" x2="706.9" y2="272.9"/><polygon points="706.9,272.9 692.9,271.2 698.4,261.6" fill="#6b7280"/>
</g>
<line x1="650" y1="240" x2="765" y2="125" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="772" cy="118" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="786" y="112" font-size="13" fill="#dc2626">target /</text>
<text x="786" y="128" font-size="13" fill="#dc2626">movement</text>
<line x1="650" y1="240" x2="743" y2="150" stroke="#2563eb" stroke-width="4"/><polygon points="743.0,150.0 737.1,165.5 727.4,155.4" fill="#2563eb"/>
<circle cx="650" cy="240" r="4" fill="#1f2937"/>
<g font-size="13">
<line x1="520" y1="390" x2="560" y2="390" stroke="#6b7280" stroke-width="2"/><polygon points="560.0,390.0 547.0,395.5 547.0,384.5" fill="#6b7280"/>
<text x="570" y="395">one neuron: preferred direction × firing rate</text>
<line x1="520" y1="420" x2="560" y2="420" stroke="#2563eb" stroke-width="4"/><polygon points="560.0,420.0 545.0,427.0 545.0,413.0" fill="#2563eb"/>
<text x="570" y="425">population vector (vector sum, scaled)</text>
</g>
</g>
</svg>
