<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Gait training after stroke: change in walking speed</text>

  <!-- axes: y = 300 - v*800 -->
  <line x1="110" y1="300" x2="620" y2="300" stroke="#6b7280" stroke-width="2"/>
  <line x1="110" y1="300" x2="110" y2="50" stroke="#6b7280" stroke-width="2"/>
  <g font-size="13" fill="#1f2937" text-anchor="end">
    <text x="102" y="304">0</text>
    <text x="102" y="224">0.10</text>
    <text x="102" y="144">0.20</text>
    <text x="102" y="64">0.30</text>
  </g>
  <g stroke="#e5e7eb">
    <line x1="111" y1="220" x2="620" y2="220"/>
    <line x1="111" y1="140" x2="620" y2="140"/>
    <line x1="111" y1="60" x2="620" y2="60"/>
  </g>
  <text x="40" y="180" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 40 180)">Change in speed (m/s)</text>

  <!-- Mid: 0.18 / 0.06 -->
  <rect x="150" y="156" width="55" height="144" fill="#2563eb"/>
  <rect x="210" y="252" width="55" height="48" fill="#9ca3af"/>
  <!-- Post: 0.25 / 0.12 -->
  <rect x="320" y="100" width="55" height="200" fill="#2563eb"/>
  <rect x="380" y="204" width="55" height="96" fill="#9ca3af"/>
  <!-- Follow-up: 0.30 / 0.15 -->
  <rect x="490" y="60" width="55" height="240" fill="#2563eb"/>
  <rect x="550" y="180" width="55" height="120" fill="#9ca3af"/>

  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="208" y="322">Mid</text>
    <text x="378" y="322">Post</text>
    <text x="548" y="322">Follow-up</text>
  </g>

  <rect x="120" y="350" width="18" height="18" fill="#2563eb"/>
  <text x="146" y="364" font-size="13" fill="#1f2937">Over-ground/treadmill (variability, errors allowed)</text>
  <rect x="120" y="374" width="18" height="18" fill="#9ca3af"/>
  <text x="146" y="388" font-size="13" fill="#1f2937">Robot-guided (variability, errors constrained)</text>
</svg>
