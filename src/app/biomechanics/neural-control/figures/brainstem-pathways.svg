<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 730" width="920" height="730" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="14" fill="#1f2937">
<!-- outlines -->
<rect x="250" y="50" width="380" height="340" rx="14" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<line x1="250" y1="170" x2="630" y2="170" stroke="#d1d5db"/>
<line x1="250" y1="290" x2="630" y2="290" stroke="#d1d5db"/>
<rect x="280" y="390" width="320" height="310" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<line x1="280" y1="520" x2="600" y2="520" stroke="#d1d5db"/>
<line x1="280" y1="610" x2="600" y2="610" stroke="#d1d5db"/>
<line x1="440" y1="50" x2="440" y2="700" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="345" y="40" text-anchor="middle" font-size="13">left (origin side)</text>
<text x="535" y="40" text-anchor="middle" font-size="13">right</text>
<g font-weight="bold">
<text x="20" y="115">Midbrain</text>
<text x="20" y="235">Pons</text>
<text x="20" y="345">Medulla</text>
<text x="20" y="460">Cervical cord</text>
<text x="20" y="570">Thoracic cord</text>
<text x="20" y="660">Lumbar cord</text>
</g>

<!-- nuclei -->
<g stroke="#1f2937" stroke-width="1">
<ellipse cx="420" cy="85" rx="20" ry="12" fill="#ede9fe"/>
<ellipse cx="380" cy="135" rx="18" ry="13" fill="#fee2e2"/>
<ellipse cx="330" cy="230" rx="26" ry="14" fill="#dbeafe"/>
<ellipse cx="300" cy="305" rx="20" ry="12" fill="#dcfce7"/>
<ellipse cx="365" cy="305" rx="20" ry="12" fill="#dcfce7"/>
<ellipse cx="420" cy="360" rx="22" ry="12" fill="#dbeafe"/>
</g>
<g font-size="13">
<text x="110" y="89">Superior colliculus</text>
<line x1="234" y1="85" x2="398" y2="85" stroke="#9ca3af"/>
<text x="110" y="140">Red nucleus</text>
<line x1="190" y1="136" x2="361" y2="136" stroke="#9ca3af"/>
<text x="110" y="234">Pontine RF</text>
<line x1="180" y1="230" x2="303" y2="230" stroke="#9ca3af"/>
<text x="110" y="300">Lateral vestibular n.</text>
<line x1="240" y1="298" x2="279" y2="302" stroke="#9ca3af"/>
<text x="110" y="324">Medial vestibular n.</text>
<line x1="238" y1="320" x2="347" y2="310" stroke="#9ca3af"/>
<text x="110" y="376">Medullary RF</text>
<line x1="198" y1="372" x2="397" y2="362" stroke="#9ca3af"/>
</g>

<!-- tracts -->
<path d="M420,97 L580,120 L580,505" fill="none" stroke="#7c3aed" stroke-width="3"/><polygon points="580.0,505.0 573.0,490.0 587.0,490.0" fill="#7c3aed"/>
<path d="M380,148 L545,170 L545,440" fill="none" stroke="#b45309" stroke-width="3"/>
<line x1="545" y1="440" x2="545" y2="690" stroke="#b45309" stroke-width="2" stroke-dasharray="3 6" opacity="0.6"/>
<line x1="330" y1="244" x2="330" y2="690" stroke="#2563eb" stroke-width="3"/><polygon points="330.0,690.0 323.0,675.0 337.0,675.0" fill="#2563eb"/>
<line x1="300" y1="317" x2="300" y2="690" stroke="#059669" stroke-width="3"/><polygon points="300.0,690.0 293.0,675.0 307.0,675.0" fill="#059669"/>
<line x1="365" y1="317" x2="365" y2="505" stroke="#059669" stroke-width="3" stroke-dasharray="8 4"/><polygon points="365.0,505.0 358.0,490.0 372.0,490.0" fill="#059669"/>
<path d="M378,314 L515,395 L515,505" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8 4"/><polygon points="515.0,505.0 508.0,490.0 522.0,490.0" fill="#059669"/>
<line x1="405" y1="372" x2="405" y2="690" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4"/><polygon points="405.0,690.0 398.0,675.0 412.0,675.0" fill="#2563eb"/>
<path d="M436,370 L485,405 L485,690" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4"/><polygon points="485.0,690.0 479.5,677.0 490.5,677.0" fill="#2563eb"/>
</g>
<!-- legend -->
<g font-size="13" fill="#1f2937">
<line x1="650" y1="80" x2="690" y2="80" stroke="#b45309" stroke-width="3"/>
<text x="700" y="85" font-weight="bold">Rubrospinal</text>
<text x="700" y="102">crosses at once (midbrain);</text>
<text x="700" y="118">in humans ends high cervical</text>
<line x1="650" y1="160" x2="690" y2="160" stroke="#7c3aed" stroke-width="3"/>
<text x="700" y="165" font-weight="bold">Tectospinal</text>
<text x="700" y="182">crosses; cervical only</text>
<line x1="650" y1="225" x2="690" y2="225" stroke="#2563eb" stroke-width="3"/>
<text x="700" y="230" font-weight="bold">Pontine reticulospinal</text>
<text x="700" y="247">ipsilateral; whole cord</text>
<line x1="650" y1="290" x2="690" y2="290" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4"/>
<text x="700" y="295" font-weight="bold">Medullary reticulospinal</text>
<text x="700" y="312">bilateral; whole cord</text>
<line x1="650" y1="355" x2="690" y2="355" stroke="#059669" stroke-width="3"/>
<text x="700" y="360" font-weight="bold">Lateral vestibulospinal</text>
<text x="700" y="377">ipsilateral; whole cord</text>
<line x1="650" y1="420" x2="690" y2="420" stroke="#059669" stroke-width="3" stroke-dasharray="8 4"/>
<text x="700" y="425" font-weight="bold">Medial vestibulospinal</text>
<text x="700" y="442">bilateral (MLF); cervical only</text>
</g>
</svg>
