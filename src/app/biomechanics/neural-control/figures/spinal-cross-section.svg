<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="14" fill="#1f2937">
<text x="490" y="78" text-anchor="middle" font-weight="bold">Dorsal (posterior)</text>
<text x="490" y="600" text-anchor="middle" font-weight="bold">Ventral (anterior)</text>
<g transform="translate(40,0)">
  <ellipse cx="450" cy="330" rx="300" ry="240" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <!-- posterior median sulcus and anterior fissure -->
  <line x1="450" y1="90" x2="450" y2="130" stroke="#6b7280" stroke-width="2"/>
  <path d="M440,570 L450,535 L460,570" fill="none" stroke="#6b7280" stroke-width="2"/>
  <!-- left half: functional zones clipped to gray matter -->
  <g stroke="#6b7280" stroke-width="1">
    <path d="M387.5,225 L385,220 L360,150 L345,118 L318,122 L312,160 L328.7,225 Z" fill="#dbeafe"/>
    <path d="M328.7,225 L387.5,225 L410,270 L446,288 L338.3,288 L345,280 L330,230 Z" fill="#fef3c7"/>
    <path d="M338.3,288 L446,288 L450,290 L450,380 L446.7,390 L255,390 L270,360 L320,310 Z" fill="#dcfce7"/>
    <path d="M255,390 L446.7,390 L445,395 L425,440 L380,480 L310,490 L255,470 L240,420 Z" fill="#fee2e2"/>
    <line x1="315.2" y1="140" x2="355.3" y2="140"/>
    <line x1="313.3" y1="165" x2="365.4" y2="165"/>
    <line x1="321" y1="195" x2="376.1" y2="195"/>
    <line x1="337.5" y1="255" x2="402.5" y2="255"/>
    <line x1="372" y1="390" x2="372" y2="481" stroke-dasharray="4 3"/>
  </g>
  <path d="M450,290 L410,270 L385,220 L360,150 L345,118 L318,122 L312,160 L330,230 L345,280 L320,310 L270,360 L240,420 L255,470 L310,490 L380,480 L425,440 L445,395 L450,380 Z" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="334" y="136">I</text>
    <text x="338" y="158">II</text>
    <text x="345" y="186">III</text>
    <text x="354" y="215">IV</text>
    <text x="367" y="245">V</text>
    <text x="375" y="276">VI</text>
    <text x="385" y="345">VII</text>
    <text x="412" y="440">VIII</text>
    <text x="305" y="440">IX</text>
  </g>
  <!-- right half: gray matter with motor pools -->
  <path d="M450,290 L490,270 L515,220 L540,150 L555,118 L582,122 L588,160 L570,230 L555,280 L580,310 L630,360 L660,420 L645,470 L590,490 L520,480 L475,440 L455,395 L450,380 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="450" cy="335" r="6" fill="#ffffff" stroke="#6b7280"/>
  <text x="450" y="368" text-anchor="middle" font-size="13" font-weight="bold">X</text>
  <g stroke="#1f2937" stroke-width="1">
    <circle cx="505" cy="405" r="11" fill="#dbeafe"/>
    <circle cx="550" cy="405" r="11" fill="#93c5fd"/>
    <circle cx="595" cy="405" r="11" fill="#3b82f6"/>
    <circle cx="635" cy="405" r="11" fill="#1d4ed8"/>
    <circle cx="510" cy="450" r="11" fill="#dbeafe"/>
    <circle cx="552" cy="450" r="11" fill="#93c5fd"/>
    <circle cx="595" cy="450" r="11" fill="#3b82f6"/>
    <circle cx="632" cy="450" r="11" fill="#1d4ed8"/>
  </g>
  <line x1="510" y1="478" x2="628" y2="478" stroke="#374151" stroke-width="1.5"/><polygon points="628.0,478.0 615.0,483.5 615.0,472.5" fill="#374151"/><polygon points="510.0,478.0 523.0,472.5 523.0,483.5" fill="#374151"/>
  <text x="450" y="205" text-anchor="middle" font-size="13">dorsal</text>
  <text x="450" y="221" text-anchor="middle" font-size="13">columns</text>
  <text x="450" y="525" text-anchor="middle" font-size="13">ventral funiculus</text>
  <text x="680" y="270" text-anchor="middle" font-size="13">lateral</text>
  <text x="680" y="286" text-anchor="middle" font-size="13">funiculus</text>
</g>
<!-- left annotations -->
<g font-size="14">
  <text x="12" y="186">Dorsal horn</text>
  <text x="12" y="203" font-size="13">laminae I–VI</text>
  <line x1="110" y1="192" x2="352" y2="192" stroke="#6b7280"/>
  <text x="12" y="336">Intermediate</text>
  <text x="12" y="353" font-size="13">zone, lamina VII</text>
  <line x1="120" y1="342" x2="390" y2="342" stroke="#6b7280"/>
  <text x="12" y="436">Ventral horn</text>
  <text x="12" y="453" font-size="13">laminae VIII–IX</text>
  <line x1="120" y1="442" x2="330" y2="442" stroke="#6b7280"/>
</g>
<!-- right annotations -->
<g font-size="14">
  <text x="808" y="372" font-weight="bold">Motor pools</text>
  <text x="830" y="410">flexors</text>
  <line x1="815" y1="400" x2="815" y2="452" stroke="#374151" stroke-width="1.5"/><polygon points="815.0,452.0 809.5,439.0 820.5,439.0" fill="#374151"/><polygon points="815.0,400.0 820.5,413.0 809.5,413.0" fill="#374151"/>
  <text x="830" y="456">extensors</text>
  <text x="808" y="500">medial pools:</text>
  <text x="808" y="517">axial, proximal</text>
  <text x="808" y="542">lateral pools:</text>
  <text x="808" y="559">distal (hand, foot)</text>

</g>
<!-- legend -->
<g font-size="14">
  <rect x="60" y="622" width="18" height="18" fill="#dbeafe" stroke="#6b7280"/><text x="86" y="636">Somatic sensory</text>
  <rect x="270" y="622" width="18" height="18" fill="#fef3c7" stroke="#6b7280"/><text x="296" y="636">Visceral sensory</text>
  <rect x="480" y="622" width="18" height="18" fill="#dcfce7" stroke="#6b7280"/><text x="506" y="636">Visceral motor / interneurons</text>
  <rect x="770" y="622" width="18" height="18" fill="#fee2e2" stroke="#6b7280"/><text x="796" y="636">Somatic motor</text>
</g>
</g>
</svg>
