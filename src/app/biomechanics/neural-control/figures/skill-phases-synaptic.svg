<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left: learning curve. x: day d -> 90 + (d-1)*25 ; y: % -> 300 - p*3.2 -->
  <text x="265" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">A. Skilled reaching: learning curve</text>
  <rect x="90" y="60" width="87" height="240" fill="#dbeafe"/>
  <rect x="177" y="60" width="100" height="240" fill="#fef3c7"/>
  <rect x="277" y="60" width="173" height="240" fill="#dcfce7"/>
  <line x1="90" y1="300" x2="450" y2="300" stroke="#6b7280" stroke-width="2"/>
  <line x1="90" y1="300" x2="90" y2="60" stroke="#6b7280" stroke-width="2"/>
  <g font-size="13" fill="#1f2937" text-anchor="end">
    <text x="84" y="304">0</text><text x="84" y="208">30</text><text x="84" y="112">60</text>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="90" y="318">1</text><text x="190" y="318">5</text><text x="315" y="318">10</text><text x="440" y="318">15</text>
    <text x="270" y="340">Days of training</text>
  </g>
  <text x="40" y="180" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 40 180)">Successful reaches (%)</text>
  <polyline points="90,298 115,297 140,295 165,292 190,280 215,240 240,180 265,128 290,112 315,110 340,108 365,111 390,108 415,109 440,108" fill="none" stroke="#2563eb" stroke-width="3"/>
  <g fill="#2563eb">
    <circle cx="90" cy="298" r="4"/><circle cx="115" cy="297" r="4"/><circle cx="140" cy="295" r="4"/><circle cx="165" cy="292" r="4"/>
    <circle cx="190" cy="280" r="4"/><circle cx="215" cy="240" r="4"/><circle cx="240" cy="180" r="4"/><circle cx="265" cy="128" r="4"/>
    <circle cx="290" cy="112" r="4"/><circle cx="315" cy="110" r="4"/><circle cx="340" cy="108" r="4"/><circle cx="365" cy="111" r="4"/>
    <circle cx="390" cy="108" r="4"/><circle cx="415" cy="109" r="4"/><circle cx="440" cy="108" r="4"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="133" y="82">1</text><text x="227" y="82">2</text><text x="363" y="82">3</text>
  </g>

  <!-- Right: synaptic efficacy. zero line at y=200 ; 1 unit = 8 px -->
  <text x="690" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">B. Synaptic efficacy in M1</text>
  <line x1="540" y1="60" x2="540" y2="300" stroke="#6b7280" stroke-width="2"/>
  <line x1="540" y1="200" x2="860" y2="200" stroke="#6b7280" stroke-width="2"/>
  <g font-size="13" fill="#1f2937" text-anchor="end">
    <text x="534" y="84">+15</text><text x="534" y="204">0</text><text x="534" y="304">−12</text>
  </g>
  <text x="495" y="180" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 495 180)">Field potential change (a.u.)</text>
  <!-- phase 1: ipsi -3 contra 0 -->
  <rect x="575" y="200" width="32" height="24" fill="#6b7280"/>
  <rect x="610" y="198" width="32" height="2" fill="#2563eb"/>
  <!-- phase 2: ipsi -3 contra 9.5 -->
  <rect x="675" y="200" width="32" height="24" fill="#6b7280"/>
  <rect x="710" y="124" width="32" height="76" fill="#2563eb"/>
  <!-- phase 3: ipsi -5 contra 1.5 -->
  <rect x="775" y="200" width="32" height="40" fill="#6b7280"/>
  <rect x="810" y="188" width="32" height="12" fill="#2563eb"/>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="608" y="270">Phase 1</text><text x="708" y="270">Phase 2</text><text x="808" y="270">Phase 3</text>
  </g>

  <!-- legends -->
  <g font-size="13" fill="#1f2937">
    <text x="90" y="368">1 = acquiring task requirements</text>
    <text x="90" y="386">2 = rapid gain in proficiency; 3 = maintenance</text>
    <rect x="560" y="354" width="16" height="16" fill="#2563eb"/>
    <text x="584" y="367">Contralateral (trained) M1</text>
    <rect x="560" y="376" width="16" height="16" fill="#6b7280"/>
    <text x="584" y="389">Ipsilateral M1</text>
  </g>
</svg>
