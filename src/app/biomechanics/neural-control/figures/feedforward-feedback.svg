<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-size="14" fill="#1f2937">
<rect x="20" y="15" width="525" height="420" rx="12" fill="none" stroke="#9ca3af" stroke-dasharray="6 5"/>
<text x="30" y="428" font-size="13" fill="#6b7280">central nervous system</text>
<text x="645" y="428" font-size="13" fill="#6b7280" text-anchor="middle">body and world</text>

<!-- boxes -->
<rect x="40" y="30" width="180" height="50" rx="25" fill="#fef3c7" stroke="#6b7280"/>
<text x="130" y="52" text-anchor="middle" font-weight="bold">Goal</text>
<text x="130" y="70" text-anchor="middle" font-size="13">"turn the key"</text>
<rect x="40" y="110" width="180" height="55" rx="25" fill="#fef3c7" stroke="#6b7280"/>
<text x="130" y="133" text-anchor="middle" font-weight="bold">Action selection</text>
<text x="130" y="151" text-anchor="middle" font-size="13">right hand, clockwise</text>
<rect x="290" y="110" width="170" height="55" rx="8" fill="#dbeafe" stroke="#6b7280"/>
<text x="375" y="134" text-anchor="middle" font-weight="bold">Inverse model</text>
<text x="375" y="152" text-anchor="middle" font-size="13">goal + state → command</text>
<rect x="290" y="245" width="170" height="55" rx="8" fill="#dbeafe" stroke="#6b7280"/>
<text x="375" y="269" text-anchor="middle" font-weight="bold">Forward model</text>
<text x="375" y="287" text-anchor="middle" font-size="13">command → prediction</text>
<rect x="565" y="110" width="160" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="645" y="134" text-anchor="middle" font-weight="bold">Hand and key</text>
<text x="645" y="152" text-anchor="middle" font-size="13">(muscles, limb)</text>
<rect x="565" y="245" width="160" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
<text x="645" y="269" text-anchor="middle" font-weight="bold">Sensory</text>
<text x="645" y="287" text-anchor="middle" font-weight="bold">receptors</text>
<rect x="190" y="370" width="80" height="40" rx="6" fill="#ffffff" stroke="#6b7280"/>
<text x="230" y="395" text-anchor="middle">gain K</text>
<circle cx="375" cy="390" r="16" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="375" y="396" text-anchor="middle" font-size="18">Σ</text>
<circle cx="230" cy="272" r="16" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="230" y="278" text-anchor="middle" font-size="18">Σ</text>

<!-- arrows: planning -->
<line x1="130" y1="80" x2="130" y2="108" stroke="#374151" stroke-width="2"/><polygon points="130.0,108.0 124.5,95.0 135.5,95.0" fill="#374151"/>
<line x1="220" y1="137" x2="288" y2="137" stroke="#374151" stroke-width="2"/><polygon points="288.0,137.0 275.0,142.5 275.0,131.5" fill="#374151"/>
<!-- motor command -->
<line x1="460" y1="137" x2="563" y2="137" stroke="#dc2626" stroke-width="3"/><polygon points="563.0,137.0 548.0,144.0 548.0,130.0" fill="#dc2626"/>
<text x="512" y="127" text-anchor="middle" font-size="13" fill="#dc2626">motor command</text>
<line x1="725" y1="137" x2="800" y2="137" stroke="#374151" stroke-width="2"/><polygon points="800.0,137.0 787.0,142.5 787.0,131.5" fill="#374151"/>
<text x="808" y="132" font-size="13">movement</text>
<line x1="645" y1="165" x2="645" y2="243" stroke="#374151" stroke-width="2"/><polygon points="645.0,243.0 639.5,230.0 650.5,230.0" fill="#374151"/>
<!-- efference copy -->
<path d="M510,137 L510,272 L462,272" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/><polygon points="462.0,272.0 475.0,266.5 475.0,277.5" fill="#dc2626"/>
<text x="518" y="200" font-size="13" fill="#dc2626">efference</text>
<text x="518" y="216" font-size="13" fill="#dc2626">copy</text>
<!-- predicted feedback -->
<line x1="375" y1="300" x2="375" y2="372" stroke="#374151" stroke-width="2"/><polygon points="375.0,372.0 369.5,359.0 380.5,359.0" fill="#374151"/>
<text x="383" y="330" font-size="13">predicted sensory</text>
<text x="383" y="346" font-size="13">feedback</text>
<text x="358" y="370" font-size="16" fill="#dc2626" font-weight="bold">−</text>
<!-- actual feedback -->
<path d="M645,300 L645,390 L393,390" fill="none" stroke="#2563eb" stroke-width="2.5"/><polygon points="393.0,390.0 408.0,383.0 408.0,397.0" fill="#2563eb"/>
<text x="520" y="382" text-anchor="middle" font-size="13" fill="#2563eb">actual sensory feedback (delayed)</text>
<text x="396" y="409" font-size="16" fill="#2563eb" font-weight="bold">+</text>
<!-- prediction error -->
<line x1="359" y1="390" x2="272" y2="390" stroke="#374151" stroke-width="2"/><polygon points="272.0,390.0 285.0,384.5 285.0,395.5" fill="#374151"/>
<text x="315" y="425" text-anchor="middle" font-size="13">prediction error</text>
<line x1="230" y1="370" x2="230" y2="290" stroke="#374151" stroke-width="2"/><polygon points="230.0,290.0 235.5,303.0 224.5,303.0" fill="#374151"/>
<text x="238" y="335" font-size="13">correction</text>
<!-- predicted position into estimate -->
<line x1="290" y1="272" x2="248" y2="272" stroke="#374151" stroke-width="2"/><polygon points="248.0,272.0 261.0,266.5 261.0,277.5" fill="#374151"/>
<text x="250" y="316" font-size="12">predicted</text>
<!-- estimate out -->
<path d="M230,256 L230,205 L330,205 L330,167" fill="none" stroke="#374151" stroke-width="2"/><polygon points="330.0,167.0 335.5,180.0 324.5,180.0" fill="#374151"/>
<line x1="330" y1="205" x2="330" y2="243" stroke="#374151" stroke-width="2"/><polygon points="330.0,243.0 324.5,230.0 335.5,230.0" fill="#374151"/>
<text x="222" y="226" text-anchor="end" font-size="13">estimated</text>
<text x="222" y="242" text-anchor="end" font-size="13">current position</text>
<text x="338" y="226" font-size="12">previous</text>
<text x="338" y="240" font-size="12">position</text>
</g>
</svg>
