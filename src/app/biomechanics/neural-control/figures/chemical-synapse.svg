<circle cx="392" cy="186" r="11" fill="#1f2937"/><text x="392.0" y="191.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<circle cx="570" cy="65" r="11" fill="#1f2937"/><text x="570.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
<text x="590.0" y="70.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Action potential invades the terminal</text>
<text x="590.0" y="87.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">and depolarizes it</text>
<circle cx="570" cy="115" r="11" fill="#1f2937"/><text x="570.0" y="120.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
<text x="590.0" y="120.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Voltage-gated Ca²⁺ channels open;</text>
<text x="590.0" y="137.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">Ca²⁺ flows in</text>
<circle cx="570" cy="165" r="11" fill="#1f2937"/><text x="570.0" y="170.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="590.0" y="170.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Ca²⁺ triggers vesicle fusion and</text>
<text x="590.0" y="187.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">transmitter release (exocytosis)</text>
<circle cx="570" cy="215" r="11" fill="#1f2937"/><text x="570.0" y="220.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
<text x="590.0" y="220.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Transmitter diffuses across the cleft</text>
<text x="590.0" y="237.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">and binds receptors</text>
<circle cx="570" cy="265" r="11" fill="#1f2937"/><text x="570.0" y="270.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
<text x="590.0" y="270.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Receptor-channels open; ion flow</text>
<text x="590.0" y="287.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">produces an EPSP or IPSP</text>
<circle cx="570" cy="315" r="11" fill="#1f2937"/><text x="570.0" y="320.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="590.0" y="320.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Clearance: enzymatic breakdown,</text>
<text x="590.0" y="337.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">reuptake, diffusion, glial uptake</text>
<circle cx="570" cy="365" r="11" fill="#1f2937"/><text x="570.0" y="370.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<text x="590.0" y="370.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Vesicle membrane is retrieved</text>
<text x="590.0" y="387.0" font-size="13" text-anchor="start" font-weight="normal" fill="#4b5563">and refilled (vesicle cycle)</text>
</svg>
