<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold">Seven major divisions of the CNS (rostral at top)</text>

  <!-- blocks -->
  <rect x="280" y="45" width="220" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" font-weight="bold">7  Cerebrum</text>
  <text x="390" y="100" text-anchor="middle" font-size="13">cortex, white matter, basal ganglia</text>

  <rect x="280" y="135" width="220" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="157" text-anchor="middle" font-weight="bold">6  Diencephalon</text>
  <text x="390" y="175" text-anchor="middle" font-size="13">thalamus, hypothalamus</text>

  <rect x="280" y="195" width="220" height="45" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="390" y="223" text-anchor="middle" font-weight="bold">5  Midbrain</text>

  <rect x="280" y="250" width="220" height="45" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" font-weight="bold">3  Pons</text>

  <rect x="280" y="305" width="220" height="45" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="390" y="333" text-anchor="middle" font-weight="bold">2  Medulla oblongata</text>

  <rect x="560" y="255" width="190" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="655" y="295" text-anchor="middle" font-weight="bold">4  Cerebellum</text>
  <text x="655" y="315" text-anchor="middle" font-size="13">(behind pons and medulla)</text>
  <line x1="500" y1="290" x2="560" y2="290" stroke="#6b7280" stroke-width="3"/>
  <line x1="500" y1="310" x2="560" y2="310" stroke="#6b7280" stroke-width="3"/>
  <text x="514" y="378" font-size="13" fill="#4b5563">cerebellar peduncles</text>
  <line x1="530" y1="364" x2="530" y2="314" stroke="#9ca3af" stroke-width="1"/>

  <rect x="280" y="360" width="220" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="390" y="392" text-anchor="middle" font-weight="bold">1  Spinal cord</text>
  <text x="390" y="412" text-anchor="middle" font-size="13">cervical, thoracic,</text>
  <text x="390" y="430" text-anchor="middle" font-size="13">lumbar, sacral segments</text>

  <!-- developmental brackets (outer, left) -->
  <path d="M170,47 h-12 v138 h12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="148" y="121" text-anchor="end" font-weight="bold">Forebrain</text>
  <path d="M170,197 h-12 v41 h12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="148" y="222" text-anchor="end" font-weight="bold">Midbrain</text>
  <path d="M170,252 h-12 v96 h12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="148" y="297" text-anchor="end" font-weight="bold">Hindbrain</text>
  <text x="148" y="315" text-anchor="end" font-size="13">(+ cerebellum)</text>

  <!-- brainstem bracket (inner) -->
  <path d="M262,197 h-12 v151 h12" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="236" y="272" text-anchor="middle" font-weight="bold" fill="#b45309" transform="rotate(-90 236 272)">Brainstem</text>

  <!-- PNS outputs -->
  <line x1="500" y1="217" x2="600" y2="217" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="600,217 590,212 590,222" fill="#6b7280"/>
  <text x="608" y="213">Cranial nerves</text>
  <text x="608" y="231" font-size="13" fill="#4b5563">to the PNS</text>
  <line x1="500" y1="405" x2="600" y2="405" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="600,405 590,400 590,410" fill="#6b7280"/>
  <text x="608" y="401">Spinal nerves</text>
  <text x="608" y="419" font-size="13" fill="#4b5563">to the PNS</text>

  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#4b5563">No division contains peripheral nerves; the brainstem and spinal cord give rise to them.</text>
</svg>
