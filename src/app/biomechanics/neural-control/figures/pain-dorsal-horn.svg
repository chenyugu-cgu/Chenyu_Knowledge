<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="30" y="30" font-size="16" font-weight="bold">Primary afferent terminations in the dorsal horn</text>

  <!-- laminae -->
  <rect x="260" y="70" width="340" height="30" fill="#fee2e2" stroke="#6b7280"/>
  <rect x="260" y="100" width="340" height="60" fill="#fef3c7" stroke="#6b7280"/>
  <rect x="260" y="160" width="340" height="80" fill="#dbeafe" stroke="#6b7280"/>
  <rect x="260" y="240" width="340" height="60" fill="#dcfce7" stroke="#6b7280"/>
  <rect x="260" y="300" width="340" height="40" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="615" y="90"><tspan font-weight="bold">I</tspan>  marginal zone</text>
  <text x="615" y="135"><tspan font-weight="bold">II</tspan>  substantia gelatinosa</text>
  <text x="615" y="205"><tspan font-weight="bold">III–IV</tspan></text>
  <text x="615" y="275"><tspan font-weight="bold">V</tspan>  (neck of dorsal horn)</text>
  <text x="615" y="325"><tspan font-weight="bold">VI</tspan>  base of dorsal horn</text>
  <path d="M800,165 L810,165 L810,295 L800,295" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="818" y="225">nucleus</text>
  <text x="818" y="243">proprius</text>

  <!-- DRG -->
  <line x1="20" y1="200" x2="80" y2="200" stroke="#6b7280" stroke-width="3"/>
  <text x="20" y="188" font-size="13" fill="#6b7280">from skin</text>
  <ellipse cx="110" cy="200" rx="30" ry="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-weight="bold">DRG</text>

  <!-- Abeta (green) -->
  <path d="M135,192 C165,120 220,58 300,58 L300,258" fill="none" stroke="#15803d" stroke-width="3"/>
  <circle cx="300" cy="200" r="6" fill="#15803d"/>
  <circle cx="300" cy="258" r="6" fill="#15803d"/>
  <!-- Adelta (blue) -->
  <path d="M138,198 C175,110 260,50 380,52 L380,270" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="380" cy="85" r="6" fill="#2563eb"/>
  <circle cx="380" cy="270" r="6" fill="#2563eb"/>
  <!-- C (orange) -->
  <path d="M138,206 C185,100 320,44 480,46 L480,135" fill="none" stroke="#c2410c" stroke-width="3"/>
  <circle cx="480" cy="85" r="6" fill="#c2410c"/>
  <circle cx="480" cy="135" r="6" fill="#c2410c"/>

  <!-- NS neuron lamina I -->
  <line x1="388" y1="88" x2="560" y2="88" stroke="#1f2937" stroke-width="2"/>
  <path d="M560,78 L582,88 L560,98 z" fill="#1f2937"/>
  <text x="570" y="64" text-anchor="middle" font-weight="bold">NS</text>
  <!-- WDR neuron lamina V -->
  <line x1="308" y1="262" x2="440" y2="270" stroke="#1f2937" stroke-width="2"/>
  <line x1="450" y1="262" x2="472" y2="140" stroke="#1f2937" stroke-width="2"/>
  <path d="M438,258 L462,270 L438,282 z" fill="#1f2937"/>
  <text x="430" y="296" font-weight="bold">WDR</text>

  <!-- projection axons -->
  <path d="M582,88 L590,88 L590,362" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M462,270 L520,270 L520,362" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M583,360 L590,374 L597,360 z" fill="#2563eb"/>
  <path d="M513,360 L520,374 L527,360 z" fill="#2563eb"/>
  <text x="555" y="396" text-anchor="middle">cross midline → contralateral anterolateral tract</text>

  <!-- legend -->
  <line x1="30" y1="408" x2="60" y2="408" stroke="#c2410c" stroke-width="3"/>
  <text x="68" y="413">C: noxious; laminae I–II</text>
  <line x1="30" y1="430" x2="60" y2="430" stroke="#2563eb" stroke-width="3"/>
  <text x="68" y="435">Aδ: noxious; laminae I and V</text>
  <line x1="30" y1="452" x2="60" y2="452" stroke="#15803d" stroke-width="3"/>
  <text x="68" y="457">Aβ: innocuous touch; laminae III–V</text>
  <text x="560" y="435">NS = nociceptive-specific neuron</text>
  <text x="560" y="457">WDR = wide dynamic range neuron</text>
</svg>
