<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Panel 1 -->
  <g transform="translate(60,0)">
    <text x="120" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Same learning,</text>
    <text x="120" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">different performance</text>
    <line x1="0" y1="260" x2="0" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="0" y1="260" x2="235" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <path d="M 2 190 C 42 115, 92 100, 230 100" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 2 255 C 42 180, 92 165, 230 165" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="120" y="282" text-anchor="middle" font-size="13" fill="#1f2937">Practice time</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(350,0)">
    <text x="120" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Different learning,</text>
    <text x="120" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">same final performance</text>
    <line x1="0" y1="260" x2="0" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="0" y1="260" x2="235" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <path d="M 2 255 C 20 120, 50 100, 230 100" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 2 255 L 170 112 Q 190 100 230 104" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="120" y="282" text-anchor="middle" font-size="13" fill="#1f2937">Practice time</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(640,0)">
    <text x="120" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Different learning,</text>
    <text x="120" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">different performance</text>
    <line x1="0" y1="260" x2="0" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="0" y1="260" x2="235" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#ax)"/>
    <path d="M 2 255 C 42 140, 92 105, 230 105" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 2 255 C 42 228, 92 218, 230 218" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="120" y="282" text-anchor="middle" font-size="13" fill="#1f2937">Practice time</text>
  </g>

  <text x="30" y="170" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 30 170)">Performance (better ↑)</text>

  <!-- Legend -->
  <line x1="290" y1="325" x2="330" y2="325" stroke="#2563eb" stroke-width="3"/>
  <text x="338" y="330" font-size="14" fill="#1f2937">Learner A</text>
  <line x1="490" y1="325" x2="530" y2="325" stroke="#d97706" stroke-width="3"/>
  <text x="538" y="330" font-size="14" fill="#1f2937">Learner B</text>
</svg>
