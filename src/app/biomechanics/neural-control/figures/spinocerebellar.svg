<path d="M 436,482 L 548,470 L 548,110 C 548,70 520,80 500,80 L 470,82" stroke="#d97706" stroke-width="2.5" fill="none" stroke-dasharray="7,4" marker-end="url(#ah-amber)" />
<text x="245.0" y="475.0" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">Ventral</text>
<text x="245.0" y="491.2" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">spinocerebellar</text>
<text x="600.0" y="185.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Cuneocerebellar: arm afferents</text>
<text x="600.0" y="201.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">ascend in the cuneate fasciculus</text>
<text x="600.0" y="217.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">to the accessory cuneate nucleus</text>
<text x="600.0" y="330.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Dorsal spinocerebellar: synapse in</text>
<text x="600.0" y="346.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Clarke's column, ascend uncrossed</text>
<text x="600.0" y="362.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">in the lateral funiculus, enter via</text>
<text x="600.0" y="378.8" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">the inferior cerebellar peduncle</text>
<text x="600.0" y="470.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Ventral spinocerebellar (dashed):</text>
<text x="600.0" y="486.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">crosses in the cord, crosses back</text>
<text x="600.0" y="502.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">in the cerebellum (superior</text>
<text x="600.0" y="518.8" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">peduncle), so net ipsilateral</text>
