<text x="516.0" y="542.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">Sacral</text>
<text x="440.0" y="590.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">left</text>
<text x="520.0" y="590.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">right</text>
<rect x="440.0" y="255.0" width="10.0" height="215.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
