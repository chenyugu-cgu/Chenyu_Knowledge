<text x="245.0" y="556.2" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">(leg)</text>
<line x1="250.0" y1="210.0" x2="312.0" y2="210.0" stroke="#d97706" stroke-width="2.5"/>
