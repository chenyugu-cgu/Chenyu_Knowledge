<text x="300.0" y="376.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#d97706">(C8–L3)</text>
<line x1="345.0" y1="365.0" x2="437.0" y2="365.0" stroke="#d97706" stroke-width="1.2"/>
