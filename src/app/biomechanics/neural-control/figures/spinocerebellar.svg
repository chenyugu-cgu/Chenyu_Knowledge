<text x="245.0" y="205.0" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">Spindle, GTO</text>
<text x="245.0" y="221.2" font-size="13" text-anchor="end" font-weight="normal" fill="#1f2937">(arm)</text>
<line x1="250.0" y1="480.0" x2="312.0" y2="480.0" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7,4"/>
