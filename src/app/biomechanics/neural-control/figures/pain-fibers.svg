<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Panel A: compound action potential -->
  <text x="30" y="36" font-size="16" font-weight="bold">A  Compound action potential of a peripheral nerve</text>
  <line x1="60" y1="300" x2="408" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="72" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M406,294 L418,300 L406,306 z" fill="#6b7280"/>
  <path d="M54,74 L60,62 L66,74 z" fill="#6b7280"/>
  <text x="235" y="322" text-anchor="middle">Time after a nerve stimulus</text>
  <text x="44" y="190" text-anchor="middle" transform="rotate(-90 44 190)">Voltage</text>
  <path d="M60,300 L88,300 L98,92 L108,300 L150,300 C158,300 162,252 172,252 C182,252 186,300 196,300 L238,300 C262,300 280,272 310,272 C340,272 360,300 395,300"
        fill="none" stroke="#1f2937" stroke-width="2.2"/>
  <text x="112" y="100">Aα / Aβ</text>
  <text x="172" y="242" text-anchor="middle" fill="#2563eb" font-weight="bold">Aδ</text>
  <text x="310" y="262" text-anchor="middle" fill="#c2410c" font-weight="bold">C</text>

  <rect x="40" y="345" width="370" height="105" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="54" y="368"><tspan font-weight="bold">Aα/Aβ</tspan>: thick myelin, 35–120 m/s; touch, proprioception</text>
  <text x="54" y="392"><tspan font-weight="bold" fill="#2563eb">Aδ</tspan>: thin myelin, 5–30 m/s; sharp first pain</text>
  <text x="54" y="416"><tspan font-weight="bold" fill="#c2410c">C</tspan>: unmyelinated, 0.5–2 m/s; dull second pain,</text>
  <text x="74" y="436">warmth, itch</text>

  <!-- Panel B: first and second pain -->
  <text x="450" y="36" font-size="16" font-weight="bold">B  First and second pain</text>
  <text x="458" y="250" text-anchor="middle" transform="rotate(-90 458 250)">Perceived pain intensity</text>

  <!-- row 1 -->
  <text x="480" y="76" font-weight="bold">Both fibers intact</text>
  <line x1="480" y1="160" x2="830" y2="160" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="480" y1="160" x2="480" y2="88" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M480,160 L510,160 L522,96 L534,160 L570,160 C610,160 620,122 660,122 C710,122 740,160 820,160" fill="none" stroke="#1f2937" stroke-width="2.2"/>
  <text x="540" y="106" fill="#2563eb">first pain (Aδ)</text>
  <text x="690" y="114" fill="#c2410c">second pain (C)</text>

  <!-- row 2 -->
  <text x="480" y="201" font-weight="bold">Aδ fibers blocked</text>
  <line x1="480" y1="285" x2="830" y2="285" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="480" y1="285" x2="480" y2="213" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M480,285 L570,285 C610,285 620,247 660,247 C710,247 740,285 820,285" fill="none" stroke="#1f2937" stroke-width="2.2"/>
  <text x="690" y="239" fill="#c2410c">second pain only</text>

  <!-- row 3 -->
  <text x="480" y="326" font-weight="bold">C fibers blocked</text>
  <line x1="480" y1="410" x2="830" y2="410" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="480" y1="410" x2="480" y2="338" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M480,410 L510,410 L522,346 L534,410 L820,410" fill="none" stroke="#1f2937" stroke-width="2.2"/>
  <text x="540" y="356" fill="#2563eb">first pain only</text>

  <text x="655" y="440" text-anchor="middle">Time after a noxious stimulus (≈ 0–2 s)</text>
</svg>
