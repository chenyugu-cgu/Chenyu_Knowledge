<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 630" width="820" height="630" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="420" y1="30" x2="420" y2="560" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="420" y="22" font-size="13" text-anchor="middle" fill="#6b7280">midline</text>
<text x="40" y="40" font-size="16" text-anchor="start" fill="#6b7280" font-weight="bold">LEFT</text>
<text x="780" y="40" font-size="16" text-anchor="end" fill="#6b7280" font-weight="bold">RIGHT</text>
<rect x="120" y="60" width="200" height="46" rx="8" fill="#dbeafe" stroke="#6b7280" stroke-width="1.2"/>
<text x="220.0" y="88.25" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Left motor cortex</text>
<rect x="60" y="170" width="150" height="46" rx="8" fill="#dcfce7" stroke="#6b7280" stroke-width="1.2"/>
<text x="135.0" y="198.25" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Left VL thalamus</text>
<rect x="250" y="250" width="140" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="320.0" y="278.25" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Pontine nuclei</text>
<rect x="520" y="210" width="230" height="60" rx="8" fill="#fef3c7" stroke="#6b7280" stroke-width="1.2"/>
<text x="635.0" y="237.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Right cerebellum</text>
<text x="635.0" y="255.0" font-size="13" text-anchor="middle" fill="#1f2937">cortex → dentate/interposed</text>
<rect x="520" y="470" width="230" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="635.0" y="498.25" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Right spinal cord, limb</text>
<polyline points="300.0,106.0 318.3,234.1" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="320.0,246.0 324.9,231.2 311.1,233.1" fill="#2563eb"/>
<polyline points="390.0,273.0 504.2,252.2" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="516.0,250.0 501.0,245.6 503.5,259.4" fill="#2563eb"/>
<text x="445" y="300" font-size="13" text-anchor="start" fill="#2563eb">MCP</text>
<polyline points="560.0,210.0 500.0,140.0 225.8,187.9" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="214.0,190.0 229.0,194.5 226.6,180.7" fill="#2563eb"/>
<text x="510" y="128" font-size="13" text-anchor="start" fill="#2563eb">SCP</text>
<polyline points="135.0,170.0 155.4,121.1" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="160.0,110.0 148.2,120.2 161.1,125.6" fill="#2563eb"/>
<polyline points="120.0,83.0 40.0,83.0 40.0,420.0 500.0,493.0 504.0,493.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<polygon points="516.0,493.0 502.0,486.0 502.0,500.0" fill="#2563eb"/>
<text x="58" y="330" font-size="13" text-anchor="start" fill="#2563eb" transform="rotate(90 58 330)">corticospinal</text>
<text x="150" y="470" font-size="13" text-anchor="start" fill="#2563eb">pyramidal decussation</text>
<polyline points="700.0,470.0 700.0,286.0" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
<polygon points="700.0,274.0 693.0,288.0 707.0,288.0" fill="#b45309"/>
<text x="710" y="380" font-size="13" text-anchor="start" fill="#b45309">spinocerebellar</text>
<text x="710" y="397" font-size="13" text-anchor="start" fill="#b45309">(ipsilateral, ICP)</text>
<circle cx="420" cy="262" r="12" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="420" y="267" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">1</text>
<circle cx="420" cy="166" r="12" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="420" y="171" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">2</text>
<circle cx="420" cy="452" r="12" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="420" y="457" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">3</text>
<text x="40" y="590" font-size="14" text-anchor="start" fill="#1f2937">Three crossings (1–3) cancel in pairs: the right cerebellum receives from and returns to the left cortex,</text>
<text x="40" y="610" font-size="14" text-anchor="start" fill="#1f2937">which drives the right body. A cerebellar lesion therefore produces signs on the same side.</text>
</svg>
