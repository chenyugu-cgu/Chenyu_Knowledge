<ellipse cx="575.0" cy="152.0" rx="32" ry="15" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="575.0" y="157.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">VPL</text>
