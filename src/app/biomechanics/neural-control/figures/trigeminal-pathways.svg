<line x1="510.0" y1="138.0" x2="640.0" y2="92.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah-red)"/>
<text x="735.0" y="70.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">VPM axons reach the</text>
<text x="735.0" y="86.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">face area of S1</text>
<text x="735.0" y="150.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Both routes: 3rd-order</text>
<text x="735.0" y="166.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">neurons in VPM</text>
<text x="735.0" y="222.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Trigeminal lemniscus</text>
<text x="735.0" y="238.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">(blue), trigemino-</text>
<text x="735.0" y="254.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">thalamic tract (red)</text>
<text x="735.0" y="292.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">Touch/pressure: principal</text>
<text x="735.0" y="308.2" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">nucleus in the pons;</text>
<text x="735.0" y="324.5" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">crosses at level of entry</text>
<text x="735.0" y="410.0" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">Pain/temperature:</text>
<text x="735.0" y="426.2" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">descends to the spinal</text>
<text x="735.0" y="442.5" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">trigeminal nucleus;</text>
<text x="735.0" y="458.8" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">crosses in the medulla</text>
