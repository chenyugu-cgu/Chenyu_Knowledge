<ellipse cx="175.0" cy="128.0" rx="12" ry="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="85.0" cy="190.0" rx="15" ry="21" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<ellipse cx="84.0" cy="222.0" rx="11" ry="17" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="110.0" y="75.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">left</text>
<text x="270.0" y="75.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">right</text>
<text x="190.0" y="345.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">Tracts cut on the left:</text>
<text x="30.0" y="372.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">• dorsal column → left body below lesion</text>
<text x="30.0" y="394.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">• corticospinal → left leg (UMN weakness)</text>
<text x="30.0" y="416.0" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">• spinothalamic (fibers that crossed</text>
<text x="42.0" y="434.0" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">from the right) → right body from</text>
<text x="42.0" y="452.0" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">~1–2 segments below the lesion</text>
<text x="560.0" y="470.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280" font-style="italic">posterior view</text>
<text x="500.0" y="48.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">patient's left</text>
<text x="625.0" y="48.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">patient's right</text>
<circle cx="560.0" cy="85.0" r="26" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="505.0" y="115.0" width="110.0" height="190.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="470.0" y="120.0" width="30.0" height="165.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="620.0" y="120.0" width="30.0" height="165.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="510.0" y="305.0" width="45.0" height="150.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="565.0" y="305.0" width="45.0" height="150.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<rect x="505.0" y="212.0" width="55.0" height="93.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="510.0" y="305.0" width="45.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<rect x="505.0" y="200.0" width="55.0" height="12.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="1"/>
<rect x="560.0" y="226.0" width="55.0" height="79.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="565.0" y="305.0" width="45.0" height="150.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<line x1="560.0" y1="115.0" x2="560.0" y2="455.0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
<text x="464.0" y="211.0" font-size="13" text-anchor="end" font-weight="bold" fill="#1f2937">T10</text>
<rect x="690.0" y="120.0" width="18.0" height="18.0" rx="0" fill="#9ca3af" stroke="#1f2937" stroke-width="1.5"/>
<text x="716.0" y="134.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">All sensation lost in</text>
<text x="716.0" y="150.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">the lesioned segment</text>
<rect x="690.0" y="190.0" width="18.0" height="18.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="716.0" y="204.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Lost: touch, vibration,</text>
<text x="716.0" y="220.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">proprioception (left)</text>
<rect x="690.0" y="260.0" width="18.0" height="18.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="716.0" y="274.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Lost: pain, temperature</text>
<text x="716.0" y="290.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">(right, from ~T12 down)</text>
<text x="690.0" y="350.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Motor (left leg):</text>
<text x="690.0" y="366.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">spastic weakness,</text>
<text x="690.0" y="382.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">hyperreflexia, Babinski</text>
<text x="690.0" y="398.8" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">sign; LMN signs at T10</text>
</svg>
