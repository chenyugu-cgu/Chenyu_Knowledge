<text x="245.0" y="625.0" font-size="13" text-anchor="end" font-weight="normal" fill="#dc2626">Pain, temperature,</text>
<text x="245.0" y="641.2" font-size="13" text-anchor="end" font-weight="normal" fill="#dc2626">crude touch (leg)</text>
<text x="340.0" y="660.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">DRG</text>
<line x1="560.0" y1="138.0" x2="590.0" y2="92.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah-blue)"/>
<line x1="575.0" y1="142.0" x2="640.0" y2="92.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah-red)"/>
<text x="730.0" y="70.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">3rd-order axons pass</text>
<text x="730.0" y="86.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">through the internal</text>
<text x="730.0" y="102.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">capsule to S1</text>
<text x="730.0" y="150.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">3rd-order neurons in</text>
<text x="730.0" y="166.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">VPL of the thalamus</text>
<text x="730.0" y="270.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">Medial lemniscus (blue)</text>
<text x="730.0" y="286.2" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">and spinothalamic tract</text>
<text x="730.0" y="302.5" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">(red) ascend on the</text>
<text x="730.0" y="318.8" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2937">side opposite the input</text>
<text x="730.0" y="392.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">DCML crosses here:</text>
<text x="730.0" y="408.2" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">gracile and cuneate</text>
<text x="730.0" y="424.5" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">nuclei send internal</text>
<text x="730.0" y="440.8" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">arcuate fibers across</text>
<text x="730.0" y="470.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">Dorsal columns ascend</text>
<text x="730.0" y="486.2" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">ipsilaterally</text>
<text x="730.0" y="588.0" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">Spinothalamic crosses</text>
<text x="730.0" y="604.2" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">here: anterior white</text>
<text x="730.0" y="620.5" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">commissure, 1–2 segments</text>
<text x="730.0" y="636.8" font-size="13" text-anchor="start" font-weight="normal" fill="#dc2626">above entry (Lissauer)</text>
