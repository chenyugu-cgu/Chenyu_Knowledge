<text x="245.0" y="481.2" font-size="13" text-anchor="end" font-weight="normal" fill="#2563eb">proprioception (arm)</text>
<text x="245.0" y="583.0" font-size="13" text-anchor="end" font-weight="normal" fill="#2563eb">Touch, vibration,</text>
<text x="245.0" y="599.2" font-size="13" text-anchor="end" font-weight="normal" fill="#2563eb">proprioception (leg)</text>
<text x="340.0" y="495.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">DRG</text>
