<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
    <!-- link body -->
    <polygon points="138,292 572,122 588,162 154,332" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <!-- joint circles -->
    <circle cx="146" cy="312" r="16" fill="#ffffff" stroke="#374151" stroke-width="3"/>
    <circle cx="580" cy="142" r="16" fill="#ffffff" stroke="#374151" stroke-width="3"/>
    <text x="112" y="356">joint i (frame {i})</text>
    <text x="548" y="196">joint i+1 (frame {i+1})</text>
    <!-- CoM -->
    <circle cx="363" cy="227" r="9" fill="#1f2937"/>
    <text x="330" y="262">C<tspan baseline-shift="sub" font-size="12">i</tspan></text>
    <!-- position vectors (gray dashed) -->
    <line x1="146" y1="312" x2="355" y2="230" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="355,230 341,230 345,240" fill="#6b7280"/>
    <text x="214" y="300" fill="#6b7280">p<tspan baseline-shift="sub" font-size="12">ci</tspan></text>
    <line x1="146" y1="312" x2="146" y2="312" stroke="#6b7280"/>
    <path d="M146,312 Q 360,330 568,150" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="568,150 556,152 562,162" fill="#6b7280"/>
    <text x="430" y="300" fill="#6b7280">p<tspan baseline-shift="sub" font-size="12">i+1</tspan></text>
    <!-- f_i at joint i (blue) -->
    <line x1="146" y1="312" x2="80" y2="200" stroke="#2563eb" stroke-width="3"/>
    <polygon points="80,200 76,220 92,212" fill="#2563eb"/>
    <text x="40" y="190" fill="#2563eb">f<tspan baseline-shift="sub" font-size="12">i</tspan></text>
    <!-- n_i curl -->
    <path d="M 118,330 A 34,34 0 1 1 176,336" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="176,336 162,342 170,328" fill="#2563eb"/>
    <text x="60" y="320" fill="#2563eb">n<tspan baseline-shift="sub" font-size="12">i</tspan></text>
    <!-- -f_{i+1} at joint i+1 -->
    <line x1="580" y1="142" x2="650" y2="70" stroke="#2563eb" stroke-width="3"/>
    <polygon points="650,70 632,76 644,88" fill="#2563eb"/>
    <text x="616" y="50" fill="#2563eb">−f<tspan baseline-shift="sub" font-size="12">i+1</tspan></text>
    <path d="M 610,126 A 34,34 0 1 0 560,112" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="560,112 574,108 566,122" fill="#2563eb"/>
    <text x="640" y="150" fill="#2563eb">−n<tspan baseline-shift="sub" font-size="12">i+1</tspan></text>
    <!-- inertial force and moment at CoM (red) -->
    <line x1="363" y1="227" x2="410" y2="90" stroke="#dc2626" stroke-width="3"/>
    <polygon points="410,90 398,104 414,108" fill="#dc2626"/>
    <text x="418" y="88" fill="#dc2626">F<tspan baseline-shift="sub" font-size="12">i</tspan> = m<tspan baseline-shift="sub" font-size="12">i</tspan> v̇<tspan baseline-shift="sub" font-size="12">ci</tspan></text>
    <path d="M 336,206 A 34,34 0 0 1 392,208" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="392,208 378,198 382,214" fill="#dc2626"/>
    <text x="318" y="196" fill="#dc2626">N<tspan baseline-shift="sub" font-size="12">i</tspan></text>
    <text x="20" y="390" font-size="14" fill="#6b7280">Blue: forces and moments from neighbouring links. Red: net force and moment that produce the link's motion.</text>
  </g>
</svg>
