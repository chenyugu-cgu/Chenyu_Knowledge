<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
    <line x1="60" y1="318" x2="560" y2="318" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
    <!-- link 1 sleeve -->
    <polygon points="104,290 294,180 306,200 116,310" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
    <!-- link 2 rod -->
    <polygon points="230,226 470,87 478,101 238,240" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <polyline points="462,72 486,114" fill="none" stroke="#1f2937" stroke-width="4"/>
    <!-- base joint -->
    <circle cx="110" cy="300" r="15" fill="#ffffff" stroke="#374151" stroke-width="3"/>
    <circle cx="110" cy="300" r="3" fill="#374151"/>
    <!-- CoMs -->
    <circle cx="205" cy="245" r="8" fill="#1f2937"/>
    <circle cx="410" cy="126" r="8" fill="#1d4ed8"/>
    <text x="150" y="196" font-size="15">m<tspan baseline-shift="sub" font-size="11">1</tspan>, I<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <text x="372" y="96" font-size="15" fill="#1d4ed8">m<tspan baseline-shift="sub" font-size="11">2</tspan>, I<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <!-- l1 dimension (above) -->
    <line x1="92" y1="268" x2="190" y2="211" stroke="#6b7280" stroke-width="1.5"/>
    <polygon points="190,211 176,212 182,223" fill="#6b7280"/>
    <text x="112" y="240" fill="#6b7280">l<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <!-- d2 dimension (below) -->
    <line x1="130" y1="335" x2="430" y2="161" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="430,161 416,162 422,173" fill="#2563eb"/>
    <text x="330" y="245" fill="#2563eb">d<tspan baseline-shift="sub" font-size="11">2</tspan></text>
    <!-- theta1 arc -->
    <line x1="110" y1="300" x2="230" y2="300" stroke="#6b7280" stroke-width="1"/>
    <path d="M 200,300 A 90,90 0 0 0 188,255" fill="none" stroke="#1f2937" stroke-width="2"/>
    <polygon points="188,255 184,270 196,267" fill="#1f2937"/>
    <text x="206" y="292">θ<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <!-- gravity -->
    <line x1="540" y1="200" x2="540" y2="285" stroke="#dc2626" stroke-width="3"/>
    <polygon points="540,300 532,284 548,284" fill="#dc2626"/>
    <text x="552" y="250" fill="#dc2626">g</text>
    <text x="40" y="36">θ<tspan baseline-shift="sub" font-size="11">1</tspan>: revolute joint, torque τ<tspan baseline-shift="sub" font-size="11">1</tspan></text>
    <text x="40" y="60">d<tspan baseline-shift="sub" font-size="11">2</tspan>: prismatic joint, force f<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  </g>
</svg>
